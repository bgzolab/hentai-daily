name: sync

on:
  workflow_dispatch:
  #  push:
  #    branches: [ main ]
  schedule:
    - cron: "0 21 * * *"
    # 东八区每天凌晨5点
  push:
    branches:
      # 开发分支验证路由
      - "vitepress-dev"

jobs:
  sync:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set TimeZone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Singapore"
          timezoneMacos: "Asia/Singapore"
          timezoneWindows: "Singapore Standard Time"

      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13.2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
        if: steps.pip-cache.outputs.cache-hit != 'true'

      - name: Ensure jq is available
        run: |
          if ! command -v jq &> /dev/null; then
            echo "jq not found, installing..."
            sudo apt-get update && sudo apt-get install -y jq
          else
            echo "jq is available: $(jq --version)"
          fi

      - name: Run Script
        run: |
          python3 src/sync.py
          python3 src/heatmap-count.py

      - name: Format JSON with jq
        run: |
          # 遍历所有 JSON 文件并用 jq 格式化（2 个空格缩进）
          # 使用 -print0 和 read -d '' 安全处理文件名
          find api/archives -maxdepth 4 -name "*.json" -type f -print0 | \
            while IFS= read -r -d '' file; do
              if jq --indent 2 '.' "$file" > /tmp/jq-tmp 2>/dev/null; then
                mv -f /tmp/jq-tmp "$file"
                echo "✓ Formatted: $file"
              else
                echo "✗ Skipped (invalid JSON): $file"
                rm -f /tmp/jq-tmp
              fi
            done

      - name: Run Safe Dir
        run: |
          git config --global --add safe.directory /github/workspace

      - name: Push Articles
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name bgzo
            git config user.email im@bgzo.cc
            git add .
            git commit -m "Sync feed"
            git push
          else
            echo "no changes";
          fi
